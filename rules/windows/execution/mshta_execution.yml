title: Suspicious MSHTA Execution
id: b6g34b4b-e8d5-22fe-bgb2-1353bd231113
status: test
description: Detects mshta.exe used to execute malicious HTA files by attackers
author: Muhammad Ali
date: 2024/01/15
tags:
  - attack.execution
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '.hta'
  condition: selection
falsepositives:
  - Legitimate HTA applications
level: high
